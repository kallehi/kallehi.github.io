<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kalle Hirvonen · the office</title>
<meta name="description" content="Kalle Hirvonen — development economist, Senior Research Fellow at IFPRI. An interactive office: click the objects on the desk for research, CV, writing, tools and data.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
/* Layout: one framed cartoon office scene; every object on the desk opens a drawer with the real content. Daytime in light mode, lamp-lit evening in dark mode. */
:root{
  --page:#e4ebe7; --fg:#1f2a30; --muted:#5a6a70; --panel:#fffdf6; --rule:#d5ddd8;
  --line:#2b2724; --pen:#2346b8; --note:#ffe27a;
  --wall:#cddbd4; --trim:#f3f0e7; --floor:#b98b62; --floor-line:#a2774f;
  --desk:#d49a5c; --desk-edge:#a8703d; --paper:#fffdf6; --paper-line:#c9c3b3;
  --sky-top:#8ec5ec; --sky-bot:#dcf0fb; --city:#7d93a8; --win:#c9dcea; --sun:#ffd45a;
  --stars:0; --glow:0; --cork:#c99a63; --land:#cfe3b0; --water:#a9d3ea;
  --b1:#3d6e8f; --b2:#c2563a; --b3:#e0b44a; --b4:#5b8a5a; --b5:#7a5c8e;
  --screen:#1d2733; --screen-fg:#9fe0b0; --metal:#8a949c; --cup:#f4f1ea;
  --display:"Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --hand:"Gochi Hand", "Comic Neue", "Chalkboard SE", cursive;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#141a20; --fg:#e8edf0; --muted:#9aa8b0; --panel:#1c242c; --rule:#2c3740;
  --line:#0f1216; --pen:#2346b8; --note:#e9cf68;
  --wall:#273644; --trim:#33424f; --floor:#3d2f27; --floor-line:#33271f;
  --desk:#94603a; --desk-edge:#6c4528; --paper:#efe9d9; --paper-line:#b5ad9a;
  --sky-top:#0b1230; --sky-bot:#2b3866; --city:#0a0f1f; --win:#f6d27a; --sun:#f1ecd8;
  --stars:1; --glow:.5; --cork:#8f6b45; --land:#b9cf9a; --water:#8fb9d1;
  --b1:#36627f; --b2:#a84b33; --b3:#c29a3e; --b4:#4f7a4e; --b5:#6a507c;
  --screen:#111a24; --screen-fg:#9fe0b0; --metal:#6d767d; --cup:#e6e1d6;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#141a20; --fg:#e8edf0; --muted:#9aa8b0; --panel:#1c242c; --rule:#2c3740;
  --line:#0f1216; --pen:#2346b8; --note:#e9cf68;
  --wall:#273644; --trim:#33424f; --floor:#3d2f27; --floor-line:#33271f;
  --desk:#94603a; --desk-edge:#6c4528; --paper:#efe9d9; --paper-line:#b5ad9a;
  --sky-top:#0b1230; --sky-bot:#2b3866; --city:#0a0f1f; --win:#f6d27a; --sun:#f1ecd8;
  --stars:1; --glow:.5; --cork:#8f6b45; --land:#b9cf9a; --water:#8fb9d1;
  --b1:#36627f; --b2:#a84b33; --b3:#c29a3e; --b4:#4f7a4e; --b5:#6a507c;
  --screen:#111a24; --screen-fg:#9fe0b0; --metal:#6d767d; --cup:#e6e1d6;
  color-scheme:dark}

body{background:var(--page);color:var(--fg);font:16px/1.55 var(--body)}
.wrap{max-width:1200px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:20px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px}
h1{font:700 clamp(1.8rem,4vw,2.6rem)/1.05 var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:4px 0 0}
.hint{font:1.25rem var(--hand);color:var(--muted);margin:0}
.scene{border:3px solid var(--line);border-radius:18px;overflow:hidden;background:var(--wall);line-height:0}
.scene svg{width:100%;height:auto;display:block}
.obj{cursor:pointer;transition:transform .18s ease}
.obj:hover,.obj:focus-visible{transform:translateY(-6px)}
.obj:focus{outline:none}
.obj:focus-visible .hit{stroke:var(--pen);stroke-width:4;stroke-dasharray:8 6}
.hit{fill:transparent;stroke:none}
.tag text{font-family:var(--hand);font-size:22px;fill:var(--pen)}
.lbl{font-family:var(--hand);fill:var(--line)}
.steam path{animation:rise 3.2s ease-in-out infinite;opacity:.0}
.steam path:nth-child(2){animation-delay:1.1s}.steam path:nth-child(3){animation-delay:2.1s}
@keyframes rise{0%{transform:translateY(8px);opacity:0}40%{opacity:.55}100%{transform:translateY(-22px);opacity:0}}
.cloud{animation:drift 40s linear infinite alternate}
@keyframes drift{to{transform:translateX(60px)}}
@media (prefers-reduced-motion:reduce){.steam path,.cloud{animation:none}.obj{transition:none}}

nav.index{display:flex;flex-wrap:wrap;gap:8px}
nav.index button{font:500 .95rem var(--body);color:var(--fg);background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:6px 14px;cursor:pointer}
nav.index button:hover,nav.index button:focus-visible{background:var(--note);color:#1f2a30;outline:none}

.scrim{position:fixed;inset:0;background:rgba(10,14,18,.35);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100%;width:min(480px,100%);background:var(--panel);color:var(--fg);border-left:3px solid var(--line);z-index:30;transform:translateX(105%);transition:transform .25s ease;display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer.open{transform:none}
.dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding:22px 24px 14px;border-bottom:2px dashed var(--rule)}
.dhead .eyebrow{font:1.2rem var(--hand);color:var(--pen);margin:0}
:root:not([data-theme="light"]) .dhead .eyebrow{color:var(--pen)}
.dhead h2{font:700 1.6rem/1.15 var(--display);margin:2px 0 0;text-wrap:balance}
.close{flex:none;font:700 1rem var(--body);background:none;border:2px solid var(--line);color:var(--fg);border-radius:10px;width:38px;height:38px;cursor:pointer}
.close:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.dbody{overflow-y:auto;padding:16px 24px 32px;min-width:0}
.dbody p{margin:0 0 12px;max-width:62ch}
.dbody h3{font:700 .78rem var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px}
.dbody ul{list-style:none;margin:0;padding:0;display:grid;gap:10px}
.dbody li{display:grid;grid-template-columns:4.6rem 1fr;gap:10px;align-items:baseline}
.dbody li.nodate{grid-template-columns:1fr}
.yr{font:600 .85rem var(--body);color:var(--muted);font-variant-numeric:tabular-nums}
.dbody a{color:var(--fg);text-decoration-color:var(--pen);text-decoration-thickness:2px;text-underline-offset:3px}
.dbody a:hover{color:var(--pen)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .dbody a:hover{color:#9db4ff}}
:root[data-theme="dark"] .dbody a:hover{color:#9db4ff}
.meta{display:block;color:var(--muted);font-size:.88rem}
code{font:.85rem ui-monospace,Menlo,monospace;background:var(--rule);padding:1px 5px;border-radius:4px;overflow-wrap:anywhere}
.btn{display:inline-block;margin-top:6px;font-weight:700;background:var(--note);color:#1f2a30 !important;border:2px solid var(--line);border-radius:10px;padding:8px 14px;text-decoration:none}
@media (max-width:640px){
  .drawer{top:auto;bottom:0;width:100%;height:82%;border-left:0;border-top:3px solid var(--line);border-radius:18px 18px 0 0;transform:translateY(105%);padding-left:env(safe-area-inset-left,0px)}
  .dhead,.dbody{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .tag text{font-size:28px}
}
.side{display:grid;justify-items:end;gap:2px}
.classic{font:500 .9rem var(--body);color:var(--muted);text-decoration-color:var(--pen);text-underline-offset:3px}
.classic:hover{color:var(--fg)}
.cite .venue{font-style:italic}
</style>
<style>
/* Quieter variant: the same office, drawn with thinner lines, a muted palette, the classic site's type, and straight labels. */
:root{
  --display:"Newsreader",Georgia,serif; --body:"Newsreader",Georgia,serif; --hand:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --page:#f4f3ef; --fg:#1a1a17; --muted:#6f6e68; --panel:#fcfcfa; --rule:#e2e1da;
  --line:#5f5b55; --pen:#3d5a73; --note:#fcfcfa;
  --wall:#e4e5e0; --trim:#f5f4ef; --floor:#cdbfae; --floor-line:#bfb09d;
  --desk:#cbb293; --desk-edge:#ae9576; --paper:#fcfcfa; --paper-line:#d3cfc4;
  --sky-top:#b9d3e4; --sky-bot:#e6eff4; --city:#a3b0bc; --win:#dde6ee; --sun:#ecd9a0;
  --cork:#d3bea0; --land:#e2e7d6; --water:#d3e2ea;
  --b1:#71879a; --b2:#a98174; --b3:#c9b78a; --b4:#879a85; --b5:#93889b;
  --screen:#2a3138; --screen-fg:#c9d8cf; --metal:#a9adb0; --cup:#f7f5f0;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#16191c; --panel:#1d2125; --rule:#30353a; --line:#0e1012; --pen:#a9bccd; --note:#23282d;
  --desk:#7d6550; --desk-edge:#5f4c3c; --floor:#3a322b; --floor-line:#2f2923; --wall:#262c31;
  --b1:#4f6170; --b2:#7a5d54; --b3:#9a8b66; --b4:#5f6f5e; --b5:#695f70; --cork:#7c6a52;
}}
body{font-size:17px}
h1{font-weight:400;letter-spacing:-.015em}
.hint{font:.72rem var(--hand);letter-spacing:.06em;text-transform:uppercase}
.classic{font:.78rem var(--hand)}
.sub{font-size:.92rem}
.scene{border:1px solid var(--rule);border-radius:4px}
/* fit the whole office in the window: the column narrows until the scene (5:3) fits below the header,
   leaving ~200px for header, links and padding; below a 560px-wide column the page scrolls instead */
.wrap{padding-bottom:24px;max-width:min(1200px,max(560px,calc((100vh - 200px) * 5 / 3 + 32px)))}
@supports (height:100svh){.wrap{max-width:min(1200px,max(560px,calc((100svh - 200px) * 5 / 3 + 32px)))}}
.obj:hover,.obj:focus-visible{transform:translateY(-3px)}
.obj:focus-visible .hit{stroke-width:2}
/* thinner outlines everywhere in the drawing */
.scene svg [stroke-width="4"],.scene svg [stroke-width="3.5"]{stroke-width:2}
.scene svg [stroke-width="3"],.scene svg [stroke-width="2.5"]{stroke-width:1.5}
.scene svg [stroke-width="2"]{stroke-width:1.2}
/* labels: straight, small mono caps on plain paper chips */
.tag rect,.tag text{transform:none}
.tag rect{stroke:var(--rule)}
.tag text{font:500 12px var(--hand);letter-spacing:.08em;text-transform:uppercase;fill:var(--pen);transform:translateY(-5px)}
.lbl{font:13px var(--hand)}
.scene svg path[fill="#c2563a"]{fill:var(--b2)}
nav.index{gap:6px 18px}
nav.index button{font:.78rem var(--hand);color:var(--muted);background:none;border:0;border-bottom:1px solid transparent;border-radius:0;padding:4px 0}
nav.index button:hover,nav.index button:focus-visible{background:none;color:var(--fg);border-bottom-color:var(--pen)}
.drawer{border-left:1px solid var(--rule)}
.dhead{border-bottom:1px solid var(--rule)}
.dhead .eyebrow{font:.7rem var(--hand);letter-spacing:.08em;text-transform:uppercase}
.dhead h2{font-weight:400}
.dbody h3{font:500 .7rem var(--hand);letter-spacing:.1em}
.dbody a{text-decoration-thickness:1px}
.yr{font:.78rem var(--hand)}
.close{border:1px solid var(--rule);border-radius:2px}
.btn{background:none;color:var(--fg) !important;border:1px solid var(--fg);border-radius:2px;font:.8rem var(--hand)}
@media (max-width:640px){.drawer{border-top:1px solid var(--rule);border-radius:4px 4px 0 0}.tag text{font-size:12px}}
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div>
      <h1>Kalle Hirvonen</h1>
      <p class="sub">Development economist · Senior Research Fellow, IFPRI · Washington, DC</p>
    </div>
    <a class="classic" href="./">Classic version →</a>
  </header>
  <noscript><p>This page needs JavaScript. The <a href="./">classic version</a> has the same content.</p></noscript>

  <nav class="index" aria-label="Sections">
    <button data-key="about">About</button>
    <button data-key="articles">Articles</button>
    <button data-key="wip">Working papers</button>
    <button data-key="cv">CV</button>
    <button data-key="field">In the field</button>
    <button data-key="writing">Writing &amp; press</button>
    <button data-key="tools">Tools</button>
    <button data-key="data">Data</button>
  </nav>
  <div class="scene">
  <svg viewBox="0 0 1200 720" role="img" aria-label="A cartoon office. Objects on the desk link to research, CV, writing, tools and data.">
    <defs>
      <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" style="stop-color:var(--sky-top)"/><stop offset="1" style="stop-color:var(--sky-bot)"/>
      </linearGradient>
      <radialGradient id="glow" cx=".5" cy="0" r="1">
        <stop offset="0" stop-color="#ffd98a" stop-opacity=".9"/><stop offset="1" stop-color="#ffd98a" stop-opacity="0"/>
      </radialGradient>
    </defs>

    <!-- room -->
    <rect x="0" y="0" width="1200" height="520" style="fill:var(--wall)"/>
    <rect x="0" y="505" width="1200" height="16" style="fill:var(--trim);stroke:var(--line)" stroke-width="3"/>
    <rect x="0" y="521" width="1200" height="200" style="fill:var(--floor)"/>
    <g style="stroke:var(--floor-line)" stroke-width="3">
      <line x1="0" y1="575" x2="1200" y2="575"/><line x1="0" y1="640" x2="1200" y2="640"/>
      <line x1="210" y1="521" x2="210" y2="575"/><line x1="640" y1="521" x2="640" y2="575"/><line x1="1010" y1="521" x2="1010" y2="575"/>
      <line x1="420" y1="575" x2="420" y2="640"/><line x1="860" y1="575" x2="860" y2="640"/>
    </g>

    <!-- window -->
    <g transform="translate(60,52)">
      <rect x="0" y="0" width="270" height="236" rx="6" style="fill:var(--trim);stroke:var(--line)" stroke-width="4"/>
      <rect x="14" y="14" width="242" height="208" fill="url(#sky)"/>
      <g style="opacity:var(--stars)" fill="#fff">
        <circle cx="40" cy="40" r="2"/><circle cx="90" cy="28" r="1.6"/><circle cx="150" cy="52" r="2"/><circle cx="70" cy="90" r="1.4"/><circle cx="220" cy="100" r="1.6"/><circle cx="120" cy="110" r="1.2"/>
      </g>
      <circle cx="226" cy="48" r="18" style="fill:var(--sun)"/>
      <g class="cloud" fill="#fff" style="opacity:calc(1 - var(--stars))">
        <ellipse cx="70" cy="70" rx="30" ry="12"/><ellipse cx="90" cy="62" rx="20" ry="12"/>
      </g>
      <!-- Washington, DC: the Capitol, the Monument, and a low skyline -->
      <g style="fill:var(--city)">
        <rect x="18" y="198" width="104" height="24"/><rect x="46" y="184" width="48" height="38"/>
        <polygon points="44,184 70,174 96,184"/>
        <rect x="56" y="160" width="28" height="16"/><path d="M53 162 a17 19 0 0 1 34 0 Z"/>
        <rect x="68" y="134" width="4" height="12"/><circle cx="70" cy="133" r="2.5"/>
        <polygon points="182,222 194,222 191,82 185,82"/><polygon points="185,82 191,82 188,70"/>
        <rect x="142" y="190" width="30" height="32"/><rect x="204" y="196" width="24" height="26"/><rect x="230" y="186" width="26" height="36"/>
      </g>
      <g style="fill:var(--win)">
        <rect x="51" y="188" width="2" height="30"/><rect x="58" y="188" width="2" height="30"/><rect x="65" y="188" width="2" height="30"/>
        <rect x="73" y="188" width="2" height="30"/><rect x="80" y="188" width="2" height="30"/><rect x="87" y="188" width="2" height="30"/>
        <rect x="148" y="198" width="6" height="6"/><rect x="160" y="208" width="6" height="6"/><rect x="210" y="204" width="6" height="6"/>
        <rect x="236" y="194" width="6" height="6"/><rect x="246" y="208" width="6" height="6"/>
      </g>
      <line x1="135" y1="14" x2="135" y2="222" style="stroke:var(--trim)" stroke-width="8"/>
      <line x1="14" y1="118" x2="256" y2="118" style="stroke:var(--trim)" stroke-width="8"/>
      <rect x="14" y="14" width="242" height="208" fill="none" style="stroke:var(--line)" stroke-width="3"/>
      <rect x="-12" y="232" width="294" height="14" rx="3" style="fill:var(--trim);stroke:var(--line)" stroke-width="3"/>
    </g>

    <!-- corkboard: in the field -->
    <g class="obj" data-key="field" tabindex="0" role="button" aria-label="In the field: survey projects in Tanzania and Ethiopia">
      <rect class="hit" x="400" y="50" width="350" height="250" rx="10"/>
      <rect x="410" y="60" width="330" height="230" rx="10" style="fill:var(--cork);stroke:var(--line)" stroke-width="4"/>
      <g transform="rotate(-2 575 175)">
        <rect x="432" y="80" width="286" height="190" style="fill:var(--water);stroke:var(--line)" stroke-width="3"/>
        <path d="M432 80 H640 C650 110 676 128 700 140 C690 170 660 190 640 222 C628 245 610 262 600 270 H432 Z" style="fill:var(--land);stroke:var(--line)" stroke-width="2.5"/>
        <ellipse cx="530" cy="196" rx="24" ry="17" style="fill:var(--water);stroke:var(--line)" stroke-width="2.5"/>
        <path d="M600 100 C620 110 640 120 660 128" fill="none" style="stroke:var(--line)" stroke-width="1.5" stroke-dasharray="4 4"/>
        <path d="M512 190 Q560 130 612 112" fill="none" stroke="#c2263a" stroke-width="2.5" stroke-dasharray="6 5"/>
        <circle cx="612" cy="112" r="8" fill="#c2263a" style="stroke:var(--line)" stroke-width="2"/>
        <circle cx="512" cy="190" r="8" fill="#c2263a" style="stroke:var(--line)" stroke-width="2"/>
        <text x="560" y="104" class="lbl" font-size="20" text-anchor="end">Ethiopia</text>
        <text x="460" y="226" class="lbl" font-size="20">Kagera</text>

      <circle cx="440" cy="76" r="6" fill="#c2263a"/><circle cx="712" cy="76" r="6" fill="#2a8a4a"/>
      <g class="tag"><rect x="600" y="262" width="128" height="36" rx="3" transform="rotate(3 664 280)" style="fill:var(--note);stroke:var(--line)" stroke-width="2"/><text x="664" y="288" text-anchor="middle" transform="rotate(3 664 280)">in the field</text></g>
    </g>

    <!-- shelf with books -->
    <g>
      <rect x="800" y="168" width="350" height="14" rx="3" style="fill:var(--desk-edge);stroke:var(--line)" stroke-width="3"/>
      <path d="M830 182 l14 22 h6 v-22 M1120 182 l-14 22 h-6 v-22" fill="none" style="stroke:var(--line)" stroke-width="3"/>
      <rect x="820" y="86" width="26" height="82" style="fill:var(--b1);stroke:var(--line)" stroke-width="3"/>
      <rect x="846" y="70" width="22" height="98" style="fill:var(--b3);stroke:var(--line)" stroke-width="3"/>
      <rect x="868" y="92" width="30" height="76" style="fill:var(--b4);stroke:var(--line)" stroke-width="3"/>
      <rect x="898" y="78" width="20" height="90" style="fill:var(--b5);stroke:var(--line)" stroke-width="3"/>
      <path d="M950 168 L970.7 160.5 L939.2 74 L918.5 81.5 Z" style="fill:var(--b1);stroke:var(--line)" stroke-width="3"/>
      <g transform="translate(24 0)"><!-- plant -->
      <rect x="1052" y="132" width="44" height="36" rx="4" style="fill:var(--b2);stroke:var(--line)" stroke-width="3"/>
      <path d="M1074 132 C1060 110 1046 104 1040 92 M1074 132 C1076 104 1090 92 1100 86 M1074 132 C1070 112 1072 96 1076 80" fill="none" stroke="#3f7a43" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="1040" cy="92" rx="10" ry="6" fill="#4f9a52"/><ellipse cx="1100" cy="86" rx="10" ry="6" fill="#4f9a52"/><ellipse cx="1076" cy="80" rx="8" ry="6" fill="#4f9a52"/>
      </g>
    </g>
    <!-- Food Policy journal (clickable) -->
    <g class="obj" data-key="editor" tabindex="0" role="button" aria-label="Food Policy: co-editor">

<script>
// paper stack
(function(){
  const g=document.getElementById('stack'); let s='';
  for(let i=0;i<16;i++){
    const y=426-i*8, off=[0,4,-3,6,-2,3,-5,2,5,-4,1,-2,4,-3,2,0][i];
    s+=`<rect x="${100+off}" y="${y}" width="170" height="8" rx="1.5" style="fill:var(--paper);stroke:var(--line)" stroke-width="2"/>`;
  }
  s+=`<polygon points="${104},${306} ${274},${306} ${266},${298} ${112},${298}" style="fill:var(--paper);stroke:var(--line)" stroke-width="2"/>`;
  g.innerHTML=s;
})();

// label chips: fit each one to its text once the fonts are in, and again when the layout changes
function sizeTags(){
  document.querySelectorAll('.tag').forEach(t=>{
    const r=t.querySelector('rect'),x=t.querySelector('text'); if(!r||!x) return;
    const b=x.getBBox(),pad=12;
    r.setAttribute('x',(b.x-pad).toFixed(1)); r.setAttribute('width',(b.width+2*pad).toFixed(1));
  });
}
document.fonts.ready.then(sizeTags);
addEventListener('resize',sizeTags);

// All publications, writing, field, tools and data come from the classic page (index.html),
// so that page stays the single place to update content.
const SCHOLAR="https://scholar.google.com/citations?user=b_Syz2kAAAAJ&hl=en";
const CLASSIC="./";
let D=null; // parsed classic page; false if it could not be loaded
let cur=null;
fetch("index.html",{cache:"no-cache"})
  .then(r=>{if(!r.ok)throw new Error(r.status);return r.text()})
  .then(t=>{D=new DOMParser().parseFromString(t,"text/html");refresh()})
  .catch(()=>{D=false;refresh()});

const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");
const link=(t,u)=>`<a href="${u}" target="_blank" rel="noopener">${esc(t)}</a>`;
const local=(t,h)=>`<a href="${CLASSIC}${h}">${esc(t)}</a>`;
const li=(body,yr)=>yr?`<li><span class="yr">${esc(yr)}</span><span>${body}</span></li>`:`<li class="nodate"><span>${body}</span></li>`;
const ul=items=>`<ul>${items.join("")}</ul>`;
const all=(root,sel)=>root?[...root.querySelectorAll(sel)]:[];
const txt=el=>el?el.textContent.trim():"";

// the block that follows a subhead in a classic-page section, matched on the subhead's first word
const block=(sec,word)=>{const h=all(D,`#${sec} .subhead`).find(s=>txt(s).toLowerCase().startsWith(word));return h?h.nextElementSibling:null};
const pubs=b=>all(b,".pub").map(p=>({yr:txt(p.querySelector(".yr")),a:p.querySelector("a.title"),cite:p.querySelector(".cite"),gloss:p.querySelector(".gloss")}));
const pubBody=p=>(p.a?link(txt(p.a),p.a.getAttribute("href")):"")+
  (p.cite?`<span class="meta cite">${p.cite.innerHTML}</span>`:"")+
  (p.gloss?`<span class="meta">${p.gloss.innerHTML}</span>`:"");
const rows=b=>all(b,".row").map(r=>{const a=r.querySelector("a.rt"),v=r.querySelector(".rv");
  return li((a?link(txt(a),a.getAttribute("href")):esc(txt(r.querySelector(".rt"))))+(v?`<span class="meta">${esc(txt(v))}</span>`:""),txt(r.querySelector(".rl")))});
const cards=sec=>all(D,`#${sec} .tool`).map(c=>{
  const name=txt(c.querySelector(".tn")),code=c.querySelector("code");
  const links=all(c,".tool-links a").map(a=>link(txt(a).replace(/\s*↗$/,""),a.getAttribute("href")));
  return li((c.tagName==="A"?link(name,c.getAttribute("href")):`<strong>${esc(name)}</strong>`)+
    `<span class="meta">${esc(txt(c.querySelector(".tk")))} · ${esc(txt(c.querySelector(".td")))}</span>`+
    (code?`<span class="meta"><code>${esc(txt(code))}</code></span>`:"")+
    (links.length?`<span class="meta">${links.join(" · ")}</span>`:""))});

// wrap a drawer body that needs the classic page
const fromClassic=f=>()=>D===null?`<p>Loading…</p>`:D===false?`<p>Couldn’t load this list. The ${local("classic version","")} has it all.</p>`:f();

const P={
  about:{e:"the name plate",t:"About",h:fromClassic(()=>{
    const prose=D.querySelector("#about .prose");
    return (prose?prose.innerHTML:"")+`
    <h3>Contact & elsewhere</h3>
    <ul><li class="nodate"><a href="mailto:k[D-O-T]hirvonen[A-T]cgiar[D-O-T]org">Email</a></li><li class="nodate">${link("Google Scholar",SCHOLAR)}</li><li class="nodate">${link("RePEc","https://ideas.repec.org/e/phi154.html")}</li><li class="nodate">${link("GitHub","https://github.com/kallehi")}</li><li class="nodate">${local("Classic version of this site","")}</li></ul>`;})},
  articles:{e:"the paper stack",t:"Publications",h:fromClassic(()=>{
    const A=pubs(block("research","articles"));
    let out=`<p>${A.length} peer-reviewed articles, newest first, then commentaries and book chapters.</p>`,yr=null,buf=[];
    const flush=()=>{if(buf.length)out+=ul(buf);buf=[]};
    A.forEach(p=>{if(p.yr!==yr){flush();out+=`<h3>${esc(p.yr)}</h3>`;yr=p.yr}buf.push(li(pubBody(p)))});
    flush();
    out+=`<h3>Commentaries</h3>`+ul(pubs(block("research","commentaries")).map(p=>li(pubBody(p),p.yr)));
    out+=`<h3>Book chapters</h3>`+ul(pubs(block("research","chapters")).map(p=>li(pubBody(p),p.yr)));
    return out;})},
  wip:{e:"the in-tray",t:"Working papers",h:fromClassic(()=>ul(pubs(block("research","working")).map(p=>li(pubBody(p)))))},
  cv:{e:"the single sheet",t:"CV",h:`<p>The full CV lists positions, grants, teaching, refereeing and editorial work.</p>
    <a class="btn" href="Hirvonen_CV.pdf" target="_blank" rel="noopener">Open CV (PDF)</a>`},
  field:{e:"the map on the wall",t:"In the field",h:fromClassic(()=>
    `<p>${esc(txt(D.querySelector("#field .field-intro")))}</p>`+
    all(D,"#field .field-item").map(f=>{
      const meta=f.querySelector(".field-meta");
      return `<h3>${esc(txt(f.querySelector(".field-loc")))}</h3><p><strong>${esc(txt(f.querySelector(".field-title")))}.</strong> `+
        all(f,".field-desc").map(d=>esc(txt(d))).join("</p><p>")+`</p>`+
        (meta?`<p class="meta">${esc(txt(meta.querySelector(".field-timeline")))}</p>`+all(meta,"a").map(a=>`<p>${link(txt(a).replace(/\s*↗$/,""),a.getAttribute("href"))}</p>`).join(""):"");
    }).join(""))},
  writing:{e:"the newspaper",t:"Writing & press",h:fromClassic(()=>{
    const arch=D.querySelector("#writing .archive");
    return `<h3>Op-eds & columns</h3>${ul(rows(block("writing","op-eds")))}
      <h3>Blog posts</h3>${ul(rows(block("writing","blog")))}
      <h3>In the media</h3>${ul(rows(D.querySelector("#media .rows")))}`+
      (arch?`<p style="margin-top:16px">${arch.innerHTML}</p>`:"");})},
  tools:{e:"the laptop",t:"Tools",h:fromClassic(()=>ul(cards("tools")))},
  data:{e:"the filing drawers",t:"Data",h:fromClassic(()=>ul(cards("data")))},
  editor:{e:"the bookshelf",t:"Food Policy",h:`<p>I’m a co-editor of <em>Food Policy</em>, an Elsevier journal on the economics and policy of food systems in rich and poor countries.</p>
    <p>${link("Visit the journal","https://www.sciencedirect.com/journal/food-policy")}</p>`},
  bin:{e:"the waste basket",t:"When did you throw this away?",h:`<p>In the last 7 days or the last 30? Recall gets fuzzy.</p>
    <p>See the ${link("telescoping paper","https://doi.org/10.1093/wber/lhac015")}<span class="meta">Telescoping error in recalled food consumption: Evidence from a survey experiment in Ethiopia · World Bank Economic Review, 2022</span></p>`},
  phone:{e:"the phone",t:"Measuring consumption over the phone",h:`<p>Can a phone survey measure household consumption well enough for standard poverty statistics? We tested it with a survey experiment in urban Ethiopia.</p>
    <ul><li class="nodate"><span>${link("Measuring consumption over the phone: Evidence from a survey experiment in urban Ethiopia","https://doi.org/10.1016/j.jdeveco.2022.103026")}<span class="meta">Journal of Development Economics, 2023</span></span></li>
    <li class="nodate"><span>${link("Can phone surveys be used for standard poverty measurement?","https://www.ifpri.org/blog/can-phone-surveys-be-used-standard-poverty-measurement-evidence-ethiopia")}<span class="meta">IFPRI blog, 2023</span></span></li></ul>`}
};

function refresh(){
  if(D) document.getElementById('stackcount').textContent=pubs(block("research","articles")).length+" articles";
  sizeTags();
  if(cur&&typeof P[cur].h==="function"&&drawer.classList.contains('open')) document.getElementById('dbody').innerHTML=P[cur].h();
}

const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim');
let last=null;
function open(key,from){
  const p=P[key]; if(!p) return;
  last=from||null; cur=key;
  document.getElementById('deyebrow').textContent="from "+p.e;
  document.getElementById('dtitle').textContent=p.t;
  const b=document.getElementById('dbody'); b.innerHTML=typeof p.h==="function"?p.h():p.h; b.scrollTop=0;
  drawer.classList.add('open'); scrim.classList.add('on'); drawer.setAttribute('aria-hidden','false');
  document.getElementById('close').focus();
}
function close(){
  drawer.classList.remove('open'); scrim.classList.remove('on'); drawer.setAttribute('aria-hidden','true');
  if(last&&last.focus) last.focus();
}
document.querySelectorAll('[data-key]').forEach(el=>{
  el.addEventListener('click',()=>open(el.dataset.key,el));
  if(el.tagName.toLowerCase()==='g') el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();open(el.dataset.key,el)}});
});
document.getElementById('close').addEventListener('click',close);
scrim.addEventListener('click',close);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&drawer.classList.contains('open'))close()});
</script>
